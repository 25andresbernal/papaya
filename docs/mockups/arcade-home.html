<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Papaya Arcade -- Home mockup</title>
<style>

    /* Google Fonts: blocked in this sandbox, so we also set real fallbacks below.
       In the shipped app these load for real and the pixel type reads correctly. */
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Pixelify+Sans:wght@500;600;700&family=Press+Start+2P&display=swap');

    :root {
      /* 24-token arcade palette: outline / mid (brand, unchanged) / highlight per hue. */
      --papaya-outline:#7A3B12; --papaya-mid:#FF8A3D; --papaya-hi:#FFC08A;
      --leaf-outline:#153B18;   --leaf-mid:#3DAA47;   --leaf-hi:#7FCB85;
      --sky-outline:#12405C;    --sky-mid:#4DA8DA;    --sky-hi:#8FCBEC;
      --sun-outline:#7A5A0A;    --sun-mid:#FFC93C;    --sun-hi:#FFE28A;
      --coral-outline:#7A2323;  --coral-mid:#FF6B6B;  --coral-hi:#FFA0A0;
      --rose-outline:#7A2F4D;   --rose-mid:#FFA6C9;   --rose-hi:#FFD3E4;
      --seed-outline:#1E140C;  --seed-mid:#3B2A1A;    --seed-hi:#6B4A2E;
      --cream-outline:#D8C79E; --cream-mid:#FFF6E5;   --cream-hi:#FFFFFF;

      --btn-red:#E21B3C; --btn-blue:#1368CE; --btn-yellow:#D89E00; --btn-green:#26890C;

      /* Fredoka/Nunito stay the "readable" register. Pixelify Sans is the everyday
         retro register. Press Start 2P is flavor-only, short all-caps strings. */
      --font-display: 'Fredoka', 'Baloo 2', system-ui, sans-serif;
      --font-body: 'Nunito', system-ui, sans-serif;
      --font-pixel: 'Pixelify Sans', 'Fredoka', monospace;
      --font-bitmap: 'Press Start 2P', 'Fredoka', monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      width: 390px;
      min-height: 844px;
      background: var(--cream-mid);
      color: var(--seed-mid);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
      /* faint dot-matrix texture app-wide, per the research's "handling the cream
         background" recommendation -- barely there, never under text. */
      background-image: radial-gradient(var(--cream-outline) 1px, transparent 1px);
      background-size: 10px 10px;
      background-position: 0 0;
    }

    h1, h2, h3, .font-display { font-family: var(--font-display); }
    .font-pixel { font-family: var(--font-pixel); }
    .font-bitmap { font-family: var(--font-bitmap); letter-spacing: 0.5px; }

    /* ---- HUD strip (dark seed-brown panel, replaces the cream top bar) ---- */
    .hud {
      background: var(--seed-mid);
      border-bottom: 3px solid var(--seed-outline);
      padding: 10px 12px 12px;
      position: relative;
      z-index: 5;
    }
    .hud-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .chip {
      display: flex; align-items: center; gap: 6px;
      background: var(--seed-outline);
      border: 2px solid var(--seed-hi);
      border-radius: 8px;
      padding: 4px 9px 4px 4px;
      box-shadow: 0 3px 0 rgba(0,0,0,0.35);
    }
    .chip .ico {
      width: 22px; height: 22px; border-radius: 6px;
      background: var(--cream-hi);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; line-height: 1;
      border: 1px solid var(--seed-outline);
    }
    .chip .val {
      /* Numbers a kid must trust stay in Fredoka, not Pixelify Sans: at UI sizes
         Pixelify's capital C reads as O and its digit 5 reads as S -- fine for
         short label words, risky for a currency count. See build notes. */
      font-family: var(--font-display); font-weight: 700; font-size: 16px;
      font-variant-numeric: tabular-nums;
      color: var(--cream-hi);
    }
    .chip.streak .val { color: var(--coral-hi); }
    .chip.papaya .val { color: var(--sun-hi); }
    .chip.ticket .val { color: var(--sky-hi); }

    .xp-row { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
    .xp-lv { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--sun-hi); white-space: nowrap; }
    .xp-track {
      flex: 1; display: flex; gap: 2px;
      background: var(--seed-outline);
      border: 2px solid var(--seed-outline);
      border-radius: 4px;
      padding: 2px;
      height: 14px;
    }
    .xp-seg { flex: 1; border-radius: 1px; background: var(--seed-hi); opacity: 0.55; }
    .xp-seg.lit { background: var(--leaf-mid); opacity: 1; box-shadow: 0 0 4px var(--leaf-hi) inset; }
    .xp-txt { font-family: var(--font-display); font-weight: 600; font-size: 11px; color: var(--cream-outline); white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* ---- pixel panel: 3px border + one corner-notch tab ----
       The notch is a real element (not ::before) sitting just inside the
       border, so it still shows on panels that also need overflow:hidden
       (the jungle band clips at the panel edge, so a pseudo-element notch
       hanging outside the box would get clipped away with it). */
    .pixel-panel {
      position: relative;
      background: var(--cream-hi);
      border: 3px solid var(--seed-outline);
      border-radius: 8px;
      box-shadow: 0 5px 0 rgba(0,0,0,0.15);
    }
    .notch {
      position: absolute;
      top: 0; left: 0;
      width: 16px; height: 16px;
      background: var(--seed-outline);
      clip-path: polygon(0 0, 100% 0, 0 100%);
      z-index: 4;
      pointer-events: none;
    }

    /* ---- pixel button: keeps btn-chunky's press-down feel, squares the corners ---- */
    .pixel-btn {
      font-family: var(--font-display); font-weight: 700;
      border: 3px solid var(--seed-outline);
      border-radius: 10px;
      box-shadow: 0 6px 0 0 var(--seed-outline);
      cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px;
      color: var(--cream-hi);
      text-align: center;
    }

    /* HUD numbers "snap in" -- discrete steps, no easing, unlike the eased characters */
    @keyframes snap-in {
      0%, 60% { opacity: 0; transform: translateY(3px) scale(0.9); }
      61% { opacity: 1; transform: translateY(0) scale(1.12); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .snap { animation: snap-in 0.5s steps(2, end) both; }

    @keyframes blink { 0%, 45% { opacity: 1; } 50%, 95% { opacity: 0; } 100% { opacity: 1; } }
    .caret { animation: blink 1s steps(1) infinite; }

    @keyframes float-soft { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .float { animation: float-soft 2.6s ease-in-out infinite; }

    /* ---- bottom tab bar, pixel toolbar ---- */
    .tabbar {
      position: sticky; bottom: 0; left: 0; right: 0;
      background: var(--seed-mid);
      border-top: 3px solid var(--seed-outline);
      display: flex;
      padding: 6px 4px 8px;
      z-index: 5;
    }
    .tab {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 5px 2px;
      border-radius: 8px;
      color: var(--cream-outline);
    }
    .tab .tab-ico { font-size: 18px; line-height: 1; }
    .tab .tab-label { font-family: var(--font-pixel); font-size: 9px; font-weight: 600; }
    .tab.active { background: var(--seed-outline); color: var(--sun-mid); box-shadow: 0 3px 0 rgba(0,0,0,0.35); }

    /* ---- jungle band: hand-built from stacked rects, low-contrast, Home only ---- */
    .jungle-wrap { position: absolute; inset: 0; overflow: hidden; border-radius: 9px 9px 0 0; pointer-events: none; }
    .jungle-wrap svg { image-rendering: pixelated; display: block; width: 100%; height: 100%; }

    .screen { padding: 14px 14px 8px; position: relative; z-index: 1; }
    .hello-row { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 12px; }
    .hello-row h1 { margin: 0; font-size: 27px; color: var(--seed-mid); }
    .switch-btn {
      width: 38px; height: 38px; border-radius: 9px; background: var(--cream-hi);
      border: 2px solid var(--seed-outline); display: flex; align-items: center; justify-content: center;
      font-size: 16px; box-shadow: 0 3px 0 var(--seed-outline);
    }

    .buddy-card { position: relative; padding: 14px; margin-bottom: 14px; overflow: hidden; }
    .bubble {
      position: relative; z-index: 2;
      background: var(--cream-mid); border: 2px solid var(--seed-outline); border-radius: 14px;
      padding: 10px 12px; text-align: center;
    }
    .bubble p { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--seed-mid); }
    .bubble .tail {
      position: absolute; right: 44px; bottom: -9px; width: 14px; height: 14px;
      background: var(--cream-mid); border-right: 2px solid var(--seed-outline); border-bottom: 2px solid var(--seed-outline);
      transform: rotate(45deg);
    }
    .stage-row { position: relative; z-index: 2; display: flex; align-items: flex-end; justify-content: space-around; margin-top: 8px; padding-top: 6px; }

    .goal-row {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--cream-hi); border: 2px solid var(--cream-outline); border-radius: 12px;
      padding: 10px 14px; margin-bottom: 14px;
    }
    .goal-row .goal-txt { font-family: var(--font-display); font-weight: 700; font-size: 16px; }
    .goal-row .goal-fire { font-family: var(--font-display); font-weight: 700; color: var(--coral-mid); font-size: 16px; }

    .continue-btn {
      width: 100%; background: var(--leaf-mid); padding: 14px 10px 16px; margin-bottom: 14px;
    }
    .continue-btn .tag { font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: 1px; opacity: 0.95; }
    .continue-btn .title { font-size: 21px; display: flex; align-items: center; gap: 6px; }

    .chest-panel { padding: 14px; margin-bottom: 14px; text-align: center; }
    .chest-inner {
      background: linear-gradient(180deg, var(--sun-hi), var(--sun-mid));
      border: 3px solid var(--seed-outline); border-radius: 8px;
      padding: 12px; display: flex; align-items: center; gap: 12px; justify-content: center;
    }
    .chest-qmark {
      width: 40px; height: 40px; border-radius: 6px; background: var(--sun-mid);
      border: 2px solid var(--seed-outline); display: flex; align-items: center; justify-content: center;
      font-family: var(--font-bitmap); font-size: 16px; color: var(--seed-outline);
      box-shadow: inset 0 0 0 2px var(--sun-hi);
    }
    .chest-txt { text-align: left; }
    .chest-txt .label { font-family: var(--font-pixel); font-weight: 700; font-size: 13px; color: var(--seed-outline); letter-spacing: 0.5px; }
    .chest-txt .sub { font-family: var(--font-body); font-weight: 700; font-size: 12px; color: var(--seed-mid); opacity: 0.75; }

    .quick-links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    .quick-links .qcard {
      background: var(--cream-hi); border: 2px solid var(--cream-outline); border-radius: 12px;
      padding: 10px 4px; text-align: center; box-shadow: 0 3px 0 var(--cream-outline);
    }
    .quick-links .qcard .qi { font-size: 22px; }
    /* "PRACTICE" has a C, which Pixelify Sans draws almost closed (reads like an O) --
       so quick-link labels stay in Fredoka, the readable register. */
    .quick-links .qcard .qt { font-family: var(--font-display); font-size: 11px; font-weight: 700; color: var(--seed-mid); margin-top: 2px; }
</style>
</head>
